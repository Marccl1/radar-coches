name: Rastreo diario

on:
  # 17:30 hora de Madrid todo el año. GitHub solo entiende UTC, así que hay dos
  # horarios y el trabajo "hora" deja seguir solo el que toca según verano/invierno.
  schedule:
    - cron: "30 15 * * *"   # 15:30 UTC = 17:30 en horario de verano (CEST)
    - cron: "30 16 * * *"   # 16:30 UTC = 17:30 en horario de invierno (CET)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano
    inputs:
      prueba_telegram:
        description: "Solo enviar un mensaje de prueba a Telegram"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rastreo
  cancel-in-progress: false

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      toca: ${{ steps.comprobar.outputs.toca }}
    steps:
      - id: comprobar
        env:
          EVENTO: ${{ github.event_name }}
          HORARIO: ${{ github.event.schedule }}
        run: |
          desfase=$(TZ=Europe/Madrid date +%z)   # +0200 verano, +0100 invierno
          if [ "$EVENTO" != "schedule" ] \
             || { [ "$HORARIO" = "30 15 * * *" ] && [ "$desfase" = "+0200" ]; } \
             || { [ "$HORARIO" = "30 16 * * *" ] && [ "$desfase" = "+0100" ]; }; then
            echo "toca=true" >> "$GITHUB_OUTPUT"
          else
            echo "toca=false" >> "$GITHUB_OUTPUT"
            echo "No toca: en Madrid ahora el desfase es $desfase."
          fi

  prueba-telegram:
    if: ${{ inputs.prueba_telegram }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python avisar.py --prueba
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  rastrear:
    needs: hora
    if: ${{ needs.hora.outputs.toca == 'true' && !inputs.prueba_telegram }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Histórico de precios y coches ya avisados: viven en la caché entre ejecuciones
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: historial-${{ github.run_id }}
          restore-keys: historial-

      - name: Rastrear
        run: python rastreador.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Avisar por Telegram
        run: python avisar.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Avisar del fallo por Telegram
        if: failure()
        run: python avisar.py --error "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: historial-${{ github.run_id }}
