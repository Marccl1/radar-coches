name: Rastreo diario

# Arranque principal: cron-job.org llama a este workflow a las 17:10 (hora de Madrid)
# con automatico=true. Las ejecuciones programadas de GitHub llegan a retrasarse
# horas, así que el "schedule" queda solo de respaldo: si hoy ya hubo un rastreo
# correcto, no hace nada.
on:
  schedule:
    - cron: "0 17 * * *"    # respaldo: 19:00 en verano / 18:00 en invierno (Madrid), o cuando GitHub pueda
  workflow_dispatch:        # botón "Run workflow" y llamada de cron-job.org
    inputs:
      prueba_telegram:
        description: "Solo enviar un mensaje de prueba a Telegram"
        type: boolean
        default: false
      automatico:
        description: "Lanzado por cron-job.org (no repite si hoy ya se hizo)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: rastreo
  cancel-in-progress: false

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      toca: ${{ steps.comprobar.outputs.toca }}
    steps:
      - id: comprobar
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          AUTOMATICO: ${{ inputs.automatico }}
        run: |
          # Lanzado a mano: siempre se ejecuta
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$AUTOMATICO" != "true" ]; then
            echo "toca=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Automático o respaldo: solo si hoy no hay ya un rastreo correcto
          hoy=$(date -u +%F)
          hecho=""
          for id in $(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/diario.yml/runs" \
                        -f created=">=$hoy" -f per_page=30 --jq '.workflow_runs[].id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                 --jq '.jobs[] | select(.name=="rastrear" and .conclusion=="success") | .name' | grep -q rastrear; then
              hecho=$id; break
            fi
          done
          if [ -n "$hecho" ]; then
            echo "toca=false" >> "$GITHUB_OUTPUT"
            echo "Hoy ya se rastreó (ejecución $hecho). No se repite."
          else
            echo "toca=true" >> "$GITHUB_OUTPUT"
          fi

  prueba-telegram:
    if: ${{ inputs.prueba_telegram }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python avisar.py --prueba
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  rastrear:
    needs: hora
    if: ${{ needs.hora.outputs.toca == 'true' && !inputs.prueba_telegram }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Histórico de precios, coches avisados y relación contado/anunciado: viven en la caché
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: historial-${{ github.run_id }}
          restore-keys: historial-

      - name: Rastrear
        run: python rastreador.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Avisar por Telegram
        run: python avisar.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Avisar del fallo por Telegram
        if: failure()
        run: python avisar.py --error "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: historial-${{ github.run_id }}
